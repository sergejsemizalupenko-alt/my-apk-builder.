<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Мой HTML to APK</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
    background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh; box-sizing: border-box;
  }
  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { color: #38bdf8; margin: 0 0 5px 0; font-size: 26px; }
  .header p { color: #94a3b8; margin: 0; font-size: 14px; }
  
  .card {
    background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 400px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155;
  }
  
  .field { margin-bottom: 20px; }
  label { display: block; margin-bottom: 8px; font-size: 15px; color: #cbd5e1; font-weight: bold; }
  input[type="text"] {
    width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #475569;
    background: #0f172a; color: #fff; font-size: 16px; box-sizing: border-box; outline: none;
  }
  input[type="text"]:focus { border-color: #38bdf8; }
  
  input[type="file"] { display: none; }
  .file-btn {
    display: block; text-align: center; padding: 14px; border-radius: 10px;
    background: #334155; color: #e2e8f0; cursor: pointer; border: 2px dashed #64748b;
    font-size: 16px; transition: 0.2s;
  }
  .file-btn.active { background: #166534; border-color: #22c55e; color: #bbf7d0; border-style: solid; }
  
  .build-btn {
    width: 100%; padding: 16px; border-radius: 12px; border: none;
    background: #22c55e; color: #052e16; font-size: 18px; font-weight: bold;
    cursor: pointer; transition: 0.2s; margin-top: 10px;
  }
  .build-btn:active { transform: scale(0.97); }
  
  .status { text-align: center; margin-top: 20px; font-size: 15px; color: #fbbf24; min-height: 22px; }
</style>
</head>
<body>

<div class="header">
  <h1>📱 APK Builder</h1>
  <p>Твой личный конвертер без рекламы</p>
</div>

<div class="card">
  <div class="field">
    <label>Название приложения:</label>
    <input type="text" id="appName" placeholder="Например: Моя Игра">
  </div>

  <div class="field">
    <label>HTML-файл игры или сайта:</label>
    <label for="fileInput" class="file-btn" id="fileLabel">📂 Выбрать файл</label>
    <input type="file" id="fileInput" accept=".html">
  </div>

  <button class="build-btn" onclick="startBuild()">Собрать APK</button>
  
  <div class="status" id="status">Ожидание файлов...</div>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const fileLabel = document.getElementById('fileLabel');
  const statusText = document.getElementById('status');

  fileInput.addEventListener('change', function(e) {
    if (e.target.files.length > 0) {
      fileLabel.innerText = "✅ " + e.target.files[0].name;
      fileLabel.classList.add('active');
      statusText.innerText = "Файл готов к сборке";
      statusText.style.color = "#38bdf8";
    }
  });

  function startBuild() {
    const appName = document.getElementById('appName').value.trim();
    if (!appName) {
      alert("Пожалуйста, напиши название приложения!");
      return;
    }
    if (fileInput.files.length === 0) {
      alert("Пожалуйста, выбери HTML-файл!");
      return;
    }

    statusText.innerText = "⏳ Сборка... (в этой версии кнопка пока демонстративная)";
    statusText.style.color = "#fbbf24";
  }
</script>
</body>
</html>
