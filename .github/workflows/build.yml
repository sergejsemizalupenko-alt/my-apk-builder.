name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build Android APK
      run: |
        mkdir -p www
        cp index.html www/index.html
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "APK Builder" "com.my.builder" --web-dir="www"
        npx cap add android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: APK-Builder
        path: android/app/build/outputs/apk/debug/app-debug.apk
